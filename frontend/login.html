<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Career Compass Kenya</title>
  <meta name="description" content="Welcome back! Login to continue your AI-powered career journey">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #4338ca;
      --secondary: #6366f1;
      --text: #1e293b;
      --text-light: #64748b;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e0e7ff 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 12px;
      background: linear-gradient(90deg, #000000, #bb0000, #006600, var(--primary));
      z-index: 10;
    }

    .container {
      width: 100%;
      max-width: 480px;
      text-align: center;
      position: relative;
      z-index: 1;
    }

    /* LOGO – ONE CLEAN LINE */
    .logo {
      margin-bottom: 32px;
    }
    .logo i {
      font-size: 90px;
      background: linear-gradient(135deg, #8b5cf6, #ec4899);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .logo-text {
      font-family: 'Poppins', sans-serif;
      font-weight: 900;
      font-size: 3.8rem;
      color: var(--primary);
      margin-top: 16px;
      letter-spacing: -1.5px;
      line-height: 1;
    }

    h1 {
      font-family: 'Poppins', sans-serif;
      font-size: 2.8rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 16px;
    }

    .subtitle {
      font-size: 1.25rem;
      color: var(--text-light);
      margin-bottom: 48px;
      line-height: 1.6;
    }

    .form-wrapper {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border-radius: 32px;
      padding: 48px 40px;
      box-shadow: 0 25px 80px rgba(79,70,229,0.25);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .form-group { margin-bottom: 24px; position: relative; }
    .input-wrapper { position: relative; }
    .input-icon {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--primary);
      font-size: 1.4rem;
      z-index: 2;
    }
    input {
      width: 100%;
      padding: 20px 20px 20px 64px;
      border: 2px solid #e2e8f0;
      border-radius: 20px;
      font-size: 1.1rem;
      background: white;
      outline: none;
      transition: all 0.4s;
      font-weight: 500;
    }
    input:focus {
      border-color: var(--primary);
      box-shadow: 0 0 0 8px rgba(79,70,229,0.15);
      transform: translateY(-2px);
    }

    .options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 16px 0 32px;
      font-size: 0.95rem;
      color: var(--text-light);
    }
    .options a { color: var(--primary); text-decoration: none; font-weight: 600; }

    .login-btn {
      width: 100%;
      padding: 20px;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      border: none;
      border-radius: 20px;
      font-weight: 700;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin: 8px 0;
      box-shadow: 0 15px 40px rgba(79,70,229,0.4);
      transition: all 0.4s;
      position: relative;
      overflow: hidden;
    }
    .login-btn:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 60px rgba(79,70,229,0.5);
    }
    .login-btn::before {
      content: '';
      position: absolute;
      top: 0; left: -100%;
      width: 100%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent);
      transition: 0.7s;
    }
    .login-btn:hover::before { left: 100%; }

    .spinner {
      width: 24px; height: 24px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top: 3px solid white;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .auth-links {
      margin-top: 32px;
      font-size: 1.05rem;
    }
    .auth-links a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
      position: relative;
    }
    .auth-links a::after {
      content: '';
      position: absolute;
      bottom: -6px; left: 0;
      width: 0; height: 3px;
      background: var(--primary);
      transition: all 0.4s;
    }
    .auth-links a:hover::after { width: 100%; }
  </style>
</head>
<body>

  <div class="container">

    <!-- ONE-LINE LOGO -->
    <div class="logo">
      <i class="fas fa-compass"></i>
      <div class="logo-text">Career Compass </div>
    </div>

    <h1>Welcome Back</h1>
    <p class="subtitle">Login to continue your journey from KCSE to your dream career</p>

    <div class="form-wrapper">
      <form id="loginForm">
        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-envelope input-icon"></i>
            <input type="email" id="email" placeholder="Email Address" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <div class="input-wrapper">
            <i class="fas fa-lock input-icon"></i>
            <input type="password" id="password" placeholder="Password" required>
          </div>
        </div>

        <div class="options">
          <label><input type="checkbox" style="accent-color:var(--primary)"> Remember me</label>
          <a href="#">Forgot password?</a>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span>Login Securely</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="auth-links">
        Don’t have an account? <a href="register.html">Sign up free</a>
      </div>
    </div>
  </div>

  <!-- SAME DESIGN + REAL LOGIN -->
<script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('loginBtn');
    const spinner = btn.querySelector('.spinner');

    form.addEventListener('submit', async e => {
        e.preventDefault();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        btn.disabled = true;
        btn.querySelector('span').textContent = 'Logging in...';
        spinner.style.display = 'block';

        const res = await fetch('/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });
        const data = await res.json();

        if (data.success) {
            confetti({ particleCount: 250, spread: 80, origin: { y: 0.6 } });
            setTimeout(() => window.location.href = data.redirect || '/home.html', 1200);
        } else {
            alert(data.message);
            btn.disabled = false;
            btn.querySelector('span').textContent = 'Login Securely';
            spinner.style.display = 'none';
        }
    });
</script>
</body>
</html>
