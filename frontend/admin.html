<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Admin | Career Compass Kenya</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body{font-family:'Inter',sans-serif;background:#f1f5f9;color:#1e293b;margin:0;padding:20px}
    header{background:#4f46e5;color:white;padding:25px;text-align:center;font-size:1.8rem;font-weight:700;border-radius:12px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:25px;margin:40px 0}
    .card{background:white;padding:30px;border-radius:12px;box-shadow:0 6px 25px rgba(0,0,0,0.1);text-align:center}
    .num{font-size:3.5rem;font-weight:800;color:#4f46e5;margin:10px 0}
    .label{font-size:1.1rem;color:#64748b}
    .tabs{margin:30px 0;display:flex;gap:15px;flex-wrap:wrap;justify-content:center}
    .tab{padding:14px 32px;background:white;border:2px solid #e2e8f0;border-radius:12px;cursor:pointer;font-weight:600}
    .tab.active{background:#4f46e5;color:white;border-color:#4f46e5}
    #content{background:white;padding:40px;border-radius:12px;min-height:400px;box-shadow:0 6px 25px rgba(0,0,0,0.1)}
    table{width:100%;border-collapse:collapse;margin-top:20px}
    th,td{padding:15px;border-bottom:1px solid #e2e8f0;text-align:left}
    th{background:#f8fafc;font-weight:600;color:#475569}
    tr:hover{background:#f8fafc}
  </style>
</head>
<body>

<header>Career Compass Kenya — Admin Panel</header>

<div class="stats">
  <div class="card"><div class="num" id="totalUsers">—</div><div class="label">Total Users</div></div>
  <div class="card"><div class="num" id="totalFeedback">—</div><div class="label">Feedback Received</div></div>
  <div class="card"><div class="num" id="activeToday">—</div><div class="label">Active Today</div></div>
</div>

<div class="tabs">
  <button class="tab active" onclick="show('users')">Users</button>
  <button class="tab" onclick="show('feedback')">Feedback</button>
  <button class="tab" onclick="show('analytics')">Analytics</button>
</div>

<div id="content">Loading data...</div>

<script>
async function loadStats() {
  try {
    const res = await fetch('/api/admin/stats', { credentials: 'include' });

    // ONLY show Access Denied if it's 403 (Forbidden)
    if (res.status === 403 || res.status === 401) {
      document.body.innerHTML = `
        <div style="text-align:center;padding:100px;background:#f8fafc;font-family:Arial">
          <h2>Access Denied</h2>
          <p>You must be logged in as <strong>admin@careercompass.ke</strong></p>
          <a href="/logout" style="color:#4f46e5;font-weight:bold">← Logout & Try Again</a>
        </div>`;
      return;
    }

    if (!res.ok) throw new Error("Server error");

    const data = await res.json();

    document.getElementById('totalUsers').textContent = data.total_users || 0;
    document.getElementById('totalFeedback').textContent = data.total_feedback || 0;
    document.getElementById('activeToday').textContent = data.active_today || 0;

    show('users');

  } catch (e) {
    document.getElementById('content').innerHTML = `<p style="color:red">Connection failed. Check server.</p>`;
  }
}

function show(tab) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  event.target.classList.add('active');

  if (tab === 'users') {
    fetch('/api/admin/stats', { credentials: 'include' })
      .then(r => { if (r.status === 403) location.href = '/logout'; return r.json(); })
      .then(data => {
        let html = `<h2>Recent Students</h2><table>
          <tr><th>Name</th><th>Email</th><th>KCSE Grade</th></tr>`;
        data.recent_users.forEach(u => {
          html += `<tr><td><strong>${u.name}</strong></td><td>${u.email}</td><td>${u.grade}</td></tr>`;
        });
        html += `</table>`;
        document.getElementById('content').innerHTML = html;
      });
  }

  if (tab === 'feedback') {
    document.getElementById('content').innerHTML = `
      <h2>Feedback System</h2>
      <div style="text-align:center;padding:60px;background:#ecfdf5;border-radius:12px">
        <h3 style="color:#166534">LIVE & WORKING</h3>
        <p style="font-size:3.5rem"><strong>${document.getElementById('totalFeedback').textContent}</strong> messages</p>
      </div>`;
  }

  if (tab === 'analytics') {
    document.getElementById('content').innerHTML = `<h2>Analytics</h2><p>Error...</p>`;
  }
}

window.onload = loadStats;
</script>
</body>
</html>
